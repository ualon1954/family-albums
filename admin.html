<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ניהול</title><link rel="stylesheet" href="css/main.css"><script src="js/config.js"></script><script src="js/utils.js"></script><script src="js/session-manager.js"></script><script src="js/theme.js"></script><script>
(function(){
  const s=getSession();
  if(!s || !s.user || !s.token){
    const ret=location.pathname.split('/').pop()+location.search;
    location.replace("index.html?autoLogin=1&return="+encodeURIComponent(ret));
  }
})();
</script>

<style id="password-toggle-eye-style">
.password-field-wrap{position:relative;display:flex;align-items:center}
.password-field-wrap input{width:100%;padding-right:48px!important}
.password-toggle-eye{
  position:absolute;right:10px;top:50%;transform:translateY(-50%);
  width:34px;height:34px;border:0;background:transparent;
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;color:currentColor;opacity:.75;
  padding:0;border-radius:8px;
}
.password-toggle-eye:hover{opacity:1;background:rgba(128,128,128,.12)}
.password-toggle-eye svg{width:21px;height:21px;pointer-events:none}
</style>

<link rel="stylesheet" href="css/session-manager.css"></head><body><header class="top"><a class="brand" href="index.html">Family <b>Album</b> ♥</a><nav id="nav"></nav><div class="actions"><button onclick="toggleTheme()">◐</button><button class="pill" onclick="logout()">יציאה</button></div></header><main class="section"><div class="heading"><div><span class="eyebrow">ADMIN</span><h1>מרכז ניהול</h1><p id="who"></p></div></div><div class="admin-grid"><section class="panel"><h2>➕ אלבום</h2><input id="at" placeholder="שם אלבום"><textarea id="ad" placeholder="תיאור"></textarea><button class="btn" onclick="newAlbum()">צור</button><p id="am"></p></section><section class="panel"><h2>📤 תמונות</h2><select id="as"></select><input id="files" type="file" accept="image/*" multiple><p class="hint">בחר תמונות — ניתן להגדיר כותרת ותאריך בנפרד לכל תמונה:</p><div id="photoMeta"></div><button class="btn" onclick="upload()">העלה</button><p id="um"></p></section><section class="panel"><h2>👤 משתמש</h2><input id="un" placeholder="שם"><input id="ue" type="email" placeholder="אימייל"><div class="password-field-wrap"><input id="up" type="password" placeholder="סיסמה">
<button type="button" class="password-toggle-eye" aria-label="הצג סיסמה" title="הצג סיסמה" data-password-toggle="up">
<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
<path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12Z"/>
<circle cx="12" cy="12" r="2.8"/>
</svg>
</button></div><select id="ur"><option>FAMILY</option><option>GUEST</option><option>ADMIN</option></select><button class="btn" onclick="newUser()">צור משתמש</button><p id="msg"></p></section><section class="panel"><h2>📋 אלבומים</h2><div id="manage"></div></section><section class="panel permissions-panel"><h2>🔐 ניהול הרשאות</h2><p class="hint">בחר משתמש ואלבום והגדר מה מותר לו לבצע.</p><select id="permUser"></select><select id="permAlbum"></select><label class="perm-check"><input id="permView" type="checkbox"> צפייה באלבום</label><label class="perm-check"><input id="permUpload" type="checkbox"> העלאת תמונות</label><label class="perm-check"><input id="permDelete" type="checkbox"> עריכה ומחיקת תמונות</label><button class="btn" onclick="savePerms()">שמור הרשאות</button><p id="permMsg"></p></section></div></main><script src="js/api.js"></script><script src="js/layout.js"></script><script>const S=requireLogin("ADMIN");if(S){mountLayout("");who.textContent="מחובר: "+S.user.name;loadAdmin();loadPermissions()}async function loadAdmin(){let r=await API.call("albums",{token:S.token},"POST");if(r.ok){as.innerHTML=r.data.map(a=>`<option value="${a.id}">${esc(a.title)}</option>`).join("");manage.innerHTML=r.data.map(a=>`<div class="manage-row"><b>${esc(a.title)}</b><button onclick="editAlbum('${a.id}','${esc(a.title).replace(/'/g,"&#39;")}')">עריכה</button><button onclick="delAlbum('${a.id}')">מחיקה</button></div>`).join("")}}async function newAlbum(){let r=await API.call("createAlbum",{token:S.token,title:at.value,description:ad.value});am.textContent=r.ok?"✓ נוצר":"✕ "+r.message;if(r.ok)loadAdmin()}async function newUser(){let r=await API.call("createUser",{token:S.token,name:un.value,email:ue.value,password:up.value,role:ur.value});msg.textContent=r.ok?"✓ נוצר":"✕ "+r.message}async function editAlbum(id,title){let n=prompt("שם חדש",title);if(!n)return;let r=await API.call("updateAlbum",{token:S.token,id,title:n});toast(r.ok?"עודכן":"שגיאה","info");loadAdmin()}async function delAlbum(id){if(!confirm("למחוק את האלבום?"))return;let r=await API.call("deleteAlbum",{token:S.token,id});toast(r.ok?"נמחק":"שגיאה","info");loadAdmin()}files.onchange=()=>{photoMeta.innerHTML="";[...files.files].forEach((f,idx)=>{const row=document.createElement("div");row.className="photo-meta-row";row.innerHTML=`<div class="meta-file">🖼️ ${esc(f.name)}</div><input class="meta-title" data-i="${idx}" placeholder="כותרת לתמונה"><input class="meta-date" data-i="${idx}" type="number" min="1800" max="2200" step="1" placeholder="שנה (למשל 1985)" title="שנת התמונה בלבד"><input class="meta-caption" data-i="${idx}" placeholder="תיאור / כיתוב (אופציונלי)">`;photoMeta.appendChild(row)})};async function upload(){if(!as.value||!files.files.length){um.textContent="בחר אלבום ותמונות";return}um.textContent="מעלה...";const selected=[...files.files];for(let idx=0;idx<selected.length;idx++){const f=selected[idx];const b=await new Promise((ok,no)=>{let fr=new FileReader();fr.onload=()=>ok(fr.result.split(",")[1]);fr.onerror=no;fr.readAsDataURL(f)});const titleInput=document.querySelector(`.meta-title[data-i="${idx}"]`),dateInput=document.querySelector(`.meta-date[data-i="${idx}"]`),captionInput=document.querySelector(`.meta-caption[data-i="${idx}"]`);let r=await API.call("uploadPhoto",{token:S.token,albumId:as.value,fileName:f.name,mimeType:f.type,base64:b,photoTitle:titleInput?.value.trim()||"",photoDate:dateInput?.value||"",caption:captionInput?.value.trim()||""});if(!r.ok){um.textContent=r.message;return}}um.textContent="✓ כל התמונות הועלו בהצלחה";files.value="";photoMeta.innerHTML=""}
let permUsers=[],permAlbums=[];
async function loadPermissions(){const [u,a]=await Promise.all([API.call("listUsers",{token:S.token}),API.call("albums",{token:S.token})]);if(u.ok){permUsers=u.data||[];permUser.innerHTML=permUsers.map(x=>`<option value="${esc(x.id)}">${esc(x.name)} — ${esc(x.email)} (${esc(x.role)})</option>`).join("")}if(a.ok){permAlbums=a.data||[];permAlbum.innerHTML=permAlbums.map(x=>`<option value="${esc(x.id)}">${esc(x.title)}</option>`).join("")}await loadPermValues()}async function loadPermValues(){if(!permUser.value||!permAlbum.value)return;const r=await API.call("getPermissions",{token:S.token,userId:permUser.value,albumId:permAlbum.value});if(!r.ok){permMsg.textContent="✕ "+r.message;return}permView.checked=!!r.data.canView;permUpload.checked=!!r.data.canUpload;permDelete.checked=!!r.data.canDelete;permMsg.textContent=""}async function savePerms(){const r=await API.call("savePermissions",{token:S.token,userId:permUser.value,albumId:permAlbum.value,canView:permView.checked,canUpload:permUpload.checked,canDelete:permDelete.checked});permMsg.textContent=r.ok?"✓ ההרשאות נשמרו":"✕ "+r.message;if(r.ok)toast("ההרשאות עודכנו","info")}
permUser?.addEventListener("change",loadPermValues);permAlbum?.addEventListener("change",loadPermValues);
</script>
<script id="password-toggle-eye-script">
(function(){
  function eyeOpen(){
    return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12Z"/><circle cx="12" cy="12" r="2.8"/></svg>';
  }
  function eyeClosed(){
    return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 3l18 18"/><path d="M10.6 6.2A10.7 10.7 0 0 1 12 6c6.5 0 10 6 10 6a17.4 17.4 0 0 1-3.1 3.8"/><path d="M6.2 6.8C3.6 8.6 2 12 2 12s3.5 6 10 6c1.4 0 2.7-.3 3.9-.8"/><path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"/></svg>';
  }
  document.addEventListener('click', function(e){
    const btn=e.target.closest('[data-password-toggle]');
    if(!btn) return;
    const id=btn.getAttribute('data-password-toggle');
    const input=document.getElementById(id);
    if(!input) return;
    const show=input.type==='password';
    input.type=show?'text':'password';
    btn.innerHTML=show?eyeClosed():eyeOpen();
    btn.setAttribute('aria-label', show?'הסתר סיסמה':'הצג סיסמה');
    btn.setAttribute('title', show?'הסתר סיסמה':'הצג סיסמה');
  });
})();
</script>

</body></html>
